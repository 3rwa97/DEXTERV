name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build debug APK
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          ARGS=""
          [ -n "$TMDB_KEY" ] && ARGS="$ARGS -PTMDB_KEY=$TMDB_KEY"
          [ -n "$GEMINI_KEY" ] && ARGS="$ARGS -PGEMINI_KEY=$GEMINI_KEY"
          gradle assembleDebug --no-daemon $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: dexter-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
